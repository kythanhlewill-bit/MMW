services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mmw-web
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      # Container mặc định chạy UTC. Job Hangfire dùng cron UTC (đúng ý đồ), nhưng view
      # hiển thị giờ local -> đặt giờ VN cho khớp thói quen đọc của trader.
      TZ: "Asia/Ho_Chi_Minh"

      # Dùng chung SQL Server của YODES (container yodes-db, alias "db" trên mạng yodes_default).
      # Database MMW là DB riêng — Express giới hạn 10GB MỖI database nên không đụng YODES.
      # MigrateAsync() trong SeedData tự tạo DB + áp migration khi container khởi động.
      ConnectionStrings__Default: "Server=db;Database=MMW;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"

      # Tài khoản admin đầu tiên — chỉ được dùng khi bảng user còn rỗng.
      BootstrapAdmin__Username: "${BOOTSTRAP_ADMIN_USER}"
      BootstrapAdmin__Password: "${BOOTSTRAP_ADMIN_PASSWORD}"

      # RÀO AN TOÀN. Enabled=true mới gửi lệnh; UseTestnet=true thì lệnh đi vào
      # testnet.binancefuture.com (tiền ảo). Hai cờ này độc lập nhau — Enabled=true mà
      # UseTestnet=false là đặt lệnh TIỀN THẬT.
      LiveTrading__Enabled: "${LIVE_TRADING_ENABLED:-false}"
      LiveTrading__UseTestnet: "${LIVE_TRADING_USE_TESTNET:-true}"

      # Cap cứng. Không khai ở đây thì rơi về mặc định appsettings.json (leverage 20,
      # 10 lệnh/ngày) — khác cấu hình bạn dùng ở máy local nên kết quả tuần thử sẽ lệch.
      LiveTrading__MaxLeverage: "${LIVE_TRADING_MAX_LEVERAGE:-5}"
      LiveTrading__DefaultLeverage: "${LIVE_TRADING_DEFAULT_LEVERAGE:-5}"
      LiveTrading__MaxNotionalUsdt: "${LIVE_TRADING_MAX_NOTIONAL_USDT:-120}"
      LiveTrading__MaxOrdersPerDay: "${LIVE_TRADING_MAX_ORDERS_PER_DAY:-5}"

      # KHÔNG khai Binance__ApiKey ở đây: mọi consumer (LiveOrderService, LiveBalanceService,
      # TradeResultSyncService) đọc key theo từng tài khoản từ bảng TradingAccounts, nhập qua
      # giao diện /Accounts. Cấu hình Binance:ApiKey không có nơi nào dùng tới.

      AiService__Provider: "${AI_PROVIDER:-DeepSeek}"
      AiService__BaseUrl: "${AI_BASE_URL:-https://api.deepseek.com}"
      AiService__ApiKey: "${AI_API_KEY}"
      AiService__Model: "${AI_MODEL:-deepseek-chat}"

      Email__From: "${EMAIL_FROM}"
      Email__SmtpHost: "${EMAIL_SMTP_HOST}"
      Email__SmtpPort: "${EMAIL_SMTP_PORT:-587}"
      Email__Username: "${EMAIL_USERNAME}"
      Email__Password: "${EMAIL_PASSWORD}"
    volumes:
      - mmw-logs:/app/logs
      # Giữ DataProtection keys qua các lần redeploy (không thì user bị logout mỗi lần deploy)
      - mmw-dataprotection:/root/.aspnet/DataProtection-Keys
    ports:
      # 8080 đã bị yodes-web chiếm -> MMW dùng 8081. Chỉ mở localhost, Nginx trên host proxy vào.
      - "127.0.0.1:8081:8080"
    # VPS không có swap và đang chia sẻ với YODES. Chặn trần để MMW không kéo sập yodes-db khi
    # job quét thị trường dồn cục. Bỏ dòng này nếu đã bật swap và muốn chạy thoải mái hơn.
    mem_limit: 2g
    restart: always
    networks:
      - yodes_default

volumes:
  mmw-logs:
  mmw-dataprotection:

networks:
  # Mạng do compose project "yodes" tạo sẵn — KHÔNG khai báo lại, chỉ gắn vào.
  yodes_default:
    external: true
