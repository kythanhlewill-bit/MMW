# Đặt tại /etc/nginx/sites-available/mmw rồi symlink sang sites-enabled.
# Đây là bản HTTP-only: chạy `certbot --nginx -d mmw.yodestarot.cloud` xong Certbot sẽ tự
# chèn khối listen 443 + chứng chỉ + chuyển hướng 80->443 vào file này.

server {
    listen 80;
    listen [::]:80;
    server_name mmw.yodestarot.cloud;

    client_max_body_size 20m;

    # SignalR (/hubs/notifications) chạy trên websocket nên cần Connection: upgrade.
    # Khối / bên dưới KHÔNG dùng được giá trị này vì proxy thường phải là keep-alive,
    # nên tách riêng — đây là chỗ cấu hình của YODES sẽ hỏng nếu bê nguyên sang.
    location /hubs/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Websocket của SignalR nằm im giữa các lần đẩy thông báo -> nới timeout để khỏi rớt.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection keep-alive;
        proxy_cache_bypass $http_upgrade;
        # Backtest / nạp kho lịch sử chạy lâu -> nới timeout để không bị 504.
        proxy_read_timeout 300s;
    }
}
